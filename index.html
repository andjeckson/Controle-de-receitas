<div id="modal-novo" class="modal">
    <div class="modal-content">
        <header class="modal-header">
            <h3>Nova Receita</h3>
            <button type="button" class="btn-close" onclick="fecharModalNovo()">&times;</button>
        </header>
        
        <p class="modal-subtitle">Preencha os dados da renovação da receita.</p>
        
        <form id="form-novo">
            <div class="input-group">
                <label>Nome do Paciente</label>
                <input type="text" id="novo-nome" placeholder="Digite o nome completo" required>
            </div>

            <div class="meds-section-header">
                <label>Medicamentos</label>
                <button type="button" class="btn-add-med" onclick="adicionarLinhaNovo()">
                    <i class='bx bx-plus'></i> Adicionar
                </button>
            </div>

            <div id="container-meds-novo">
                </div>

            <div class="input-group">
                <label>Data da Renovação</label>
                <div class="input-with-icon">
                    <i class='bx bx-calendar'></i>
                    <input type="date" id="novo-data" required>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="fecharModalNovo()">Cancelar</button>
                <button type="submit" class="btn-update">Salvar</button>
            </div>
        </form>
    </div>
</div>


<div id="modal-edicao" class="modal">
    <div class="modal-content">
        <header class="modal-header">
            <h3>Editar Receita</h3>
            <button type="button" class="btn-close" onclick="fecharModal()">&times;</button>
        </header>
        
        <p class="modal-subtitle">Atualize os dados da renovação da receita.</p>
        
        <form id="form-edicao">
            <input type="hidden" id="edit-id">
            
            <div class="input-group">
                <label>Nome do Paciente</label>
                <input type="text" id="edit-nome" required>
            </div>

            <div class="meds-section-header">
                <label>Medicamentos</label>
                <button type="button" class="btn-add-med" onclick="adicionarLinhaMedicamento()">
                    <i class='bx bx-plus'></i> Adicionar
                </button>
            </div>

            <div id="container-meds-edit">
                </div>

            <div class="input-group">
                <label>Data da Renovação</label>
                <div class="input-with-icon">
                    <i class='bx bx-calendar'></i>
                    <input type="date" id="edit-data" required>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="btn-update">Atualizar</button>
            </div>
        </form>
    </div>
</div>
